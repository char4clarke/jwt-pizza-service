name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    services:
      mysql:
        image: mysql:8.0.29
        env:
          MYSQL_ROOT_PASSWORD: tempdbpassword
          MYSQL_DATABASE: pizza
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -ptempdbpassword" --health-interval 10s --health-start-period 10s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Write config file
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            jwtSecret: process.env.JWT_SECRET,
            db: {
              connection: {
                host: '127.0.0.1',
                user: 'root',
                password: 'tempdbpassword',
                database: 'pizza',
                connectTimeout: 60000,
              },
              listPerPage: 10,
            },
            factory: {
              url: 'https://pizza-factory.cs329.click',
              apiKey: process.env.FACTORY_API_KEY,
            },
          };
          fs.writeFileSync('src/config.js', 'module.exports = ' + JSON.stringify(config) + ';\n', { mode: 0o600 });
          NODE

      - name: Tests
        id: tests
        run: npm test

      - name: set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > src/version.json

      - name: Update coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          NET_ID: ${{ secrets.NET_ID }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          async function publishCoverage() {
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const coverage = summary.total.lines.pct;
            const color = coverage < 80 ? 'red' : 'green';
            const url = new URL(`https://pizza-factory.cs329.click/api/badge/${encodeURIComponent(process.env.NET_ID)}/jwtpizzaservicecoverage`);
            url.search = new URLSearchParams({ label: 'Coverage', value: `${coverage}%`, color }).toString();
            const response = await fetch(url, {
              method: 'POST',
              headers: { authorization: `bearer ${process.env.FACTORY_API_KEY}` },
            });
            if (!response.ok) throw new Error(`Coverage badge update failed (HTTP ${response.status})`);
            console.log(`Published line coverage: ${coverage}% (${color})`);
          }
          publishCoverage().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
      - name: Create dist
        run: |
            mkdir -p dist
            cp Dockerfile dist/
            cp -r src/* dist/
            cp *.json dist/
            sed -i "s/root/${{ secrets.DB_USERNAME }}/g" dist/config.js
            sed -i "s/tempdbpassword/${{ secrets.DB_PASSWORD }}/g" dist/config.js
            sed -i "s/127.0.0.1/${{ secrets.DB_HOSTNAME }}/g" dist/config.js

      - name: Update distribution artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: dist/

  deploy:
    name: Deploy to ECR
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    env:
      version: ${{ needs.build.outputs.version }}

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: package

      - name: Create OIDC token to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.CI_IAM_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up machine emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker build
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: jwt-pizza-service
        run: |
          docker build --platform=linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> "$GITHUB_OUTPUT"
